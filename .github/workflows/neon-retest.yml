name: Verify mobile submission transport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-retest.yml'
permissions:
  contents: write
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployed Neon API without writing teacher responses
        env:
          API_URL: https://br-muddy-silence-aukq6psb-itsqmetdocentes.compute.c-10.us-east-1.aws.neon.tech
        run: |
          set -euo pipefail
          health="$(curl --retry 3 --retry-delay 2 -fsS --max-time 20 "$API_URL/api/health")"
          echo "$health" | jq -e '.ok == true'
          catlog="$(curl --retry 3 --retry-delay 2 -fsS --max-time 20 "$API_URL/api/catalog")"
          echo "$catlog" | jq -e '.careers | length == 27'
          headers="$(mktemp)"
          receipt="$(curl -sS -D "$headers" --max-time 20 -H 'Origin: https://jeffer91.github.io' "$API_URL/api/submissions/status?token=11111111-1111-4111-8111-111111111111")"
          echo "$receipt" | jq -e '.ok == true and .confirmed == false'
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://jeffer91.github.io' "$headers"
          code="$(curl -sS -D "$headers" -o /tmp/submission-response.json -w '%{http_code}' --max-time 30 -X POST -H 'Origin: https://jeffer91.github.io' -H 'Accept: application/json' -H 'Content-Type: text/plain;charset=UTF-8' --data-binary '{"periodCode":"2026-2027"}' "$API_URL/api/submissions")"
          test "$code" = "400"
          jq -e '.message == "Faltan respuestas obligatorias."' /tmp/submission-response.json
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://jeffer91.github.io' "$headers"
          printf '{"health":true,"catalog":true,"receipt_status":true,"cors":true,"mobile_post_text_plain":true,"no_fake_survey":true}\n' > .neon-build/retest.json
      - name: Report passed tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .neon-build/retest.json
          git commit -m "Pass mobile API transport smoke tests"
          git push origin HEAD:main

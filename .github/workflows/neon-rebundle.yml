name: Bundle Neon updated API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-rebundle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate browser source
        run: node --check app.js
      - name: Bundle Neon Function
        run: |
          mkdir -p .neon-build
          npx esbuild api/index.ts --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=.neon-build/index.mjs
          (cd .neon-build && zip -q itsqmetdocentes.zip index.mjs)
      - name: Publish bundle artifact to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .neon-build/itsqmetdocentes.zip
          git commit -m "Bundle updated Neon Function after second review"
          git push origin HEAD:main

name: Validate Neon survey API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-smoke.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test deployed API without modifying surveys
        env:
          API_URL: https://br-muddy-silence-aukq6psb-itsqmetdocentes.compute.c-10.us-east-1.aws.neon.tech
        run: |
          set -euo pipefail
          health="$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$API_URL/api/health")"
          echo "$health" | jq -e '.ok == true'
          catalog="$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$API_URL/api/catalog")"
          echo "$catalog" | jq -e '.careers | length == 27'
          headers="$(mktemp)"
          status="$(curl -fsS -D "$headers" --max-time 20 -H 'Origin: https://jeffer91.github.io' "$API_URL/api/submissions/status?token=11111111-1111-4111-8111-111111111111")"
          echo "$status" | jq -e '.ok == true and .confirmed == false and .id == null'
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://jeffer91.github.io' "$headers"
          curl -fsS -X OPTIONS --max-time 20 -D "$headers" -o /dev/null -H 'Origin: https://jeffer91.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: Content-Type' "$API_URL/api/submissions"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://jeffer91.github.io' "$headers"
          printf '{"health":true,"catalog":true,"receipt_status":true,"cors":true,"preflight":true}\n' > .neon-build/smoke-result.json
      - name: Record smoke test success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .neon-build/smoke-result.json
          git commit -m "Verify live Neon survey endpoints"
          git push origin HEAD:main
